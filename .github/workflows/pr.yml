name: PR gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - run: pnpm install --frozen-lockfile
      - name: Install Linux check isolation
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # Chromium for Storybook and Chromium/Firefox for Studio keyboard/IME E2E.
      - run: pnpm --filter @corral/studio exec playwright install --with-deps chromium firefox
      - run: pnpm spec:check
      - run: pnpm contracts:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:e2e
