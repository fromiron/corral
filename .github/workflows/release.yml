name: Release evidence
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @corral/studio exec playwright install --with-deps chromium firefox
      # Storybook axe and keyboard/IME E2E are included. This never calls paid providers.
      - run: pnpm release:gate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: deterministic-release-evidence
          if-no-files-found: error
          path: |
            test-results/release/
            test-results/performance/**/measurements.json
            test-results/performance/**/*.cpuprofile
            test-results/performance/**/*.svg
      # This workflow creates candidate evidence, not a release or a live-smoke attestation.
