[package]
name = "corral-local-ai-helper"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Resident LiteRT-LM embedding helper for Corral local AI. Talks JSON lines on stdin/stdout only."

[dependencies]
libloading = "=0.8.8"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"

[profile.release]
opt-level = 3
lto = true
